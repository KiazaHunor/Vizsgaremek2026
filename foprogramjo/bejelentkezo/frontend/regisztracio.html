<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/regisztracio.css">
</head>
<body>
    <main class="auth-page">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100 py-4">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                    <div class="card auth-card shadow-lg">
                        <div class="card-header text-white text-center py-4">
                            <h1 class="mb-0 h3">Regisztráció</h1>
                        </div>

                        <div class="card-body p-4 p-md-4">
                            <div class="mb-3">
                                <label class="form-label" for="email">Email cím</label>
                                <input type="email" id="email" class="form-control" placeholder="email@pelda.hu">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="user">Felhasználónév</label>
                                <input type="text" id="user" class="form-control" placeholder="Felhasználónév">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="pass">Jelszó</label>
                                <input type="password" id="pass" class="form-control" placeholder="Jelszó">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="passconf">Jelszó megerősítés</label>
                                <input type="password" id="passconf" class="form-control" placeholder="Jelszó újra">
                            </div>

                            <div class="d-grid mb-3">
                                <button class="btn btn-main" onclick="register()">Regisztráció</button>
                            </div>

                            <div class="auth-links text-center">
                                <a href="index.html">Vissza a bejelentkezéshez</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
