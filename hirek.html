<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Hírek</title>
</head>

<body>
    <div id="news-container"></div>

    <script>
        function loadNews() {
            fetch("hirek.php") // fontos: helyes útvonal!
                .then(r => r.json())
                .then(data => {
                    const newsContainer = document.getElementById("news-container");
                    newsContainer.innerHTML = "";

                    if (data.error) {
                        newsContainer.innerHTML =
                            `<div>${data.error}</div>`;
                        return;
                    }

                    data.forEach(item => {
                        const col = document.createElement("div");

                        col.innerHTML = `
                          <div onclick="window.open('${item.link}', '_blank')">
                            ${item.image ? `<img src="${item.image}" style="width:200px">` : ""}
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                          </div>
                        `;

                        newsContainer.appendChild(col);
                    });
                })
                .catch(() => {
                    document.getElementById("news-container").innerHTML =
                        `Hiba a hírek betöltésénél`;
                });
        }

        loadNews();
    </script>
</body>
</html>
