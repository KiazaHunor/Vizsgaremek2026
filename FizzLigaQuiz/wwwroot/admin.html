<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizz Liga - Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        h1, h2 {
            color: #222;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #218838;
        }

        .message {
            margin-top: 12px;
            font-weight: bold;
        }

        .card {
            background: #f8f9fa;
            padding: 15px;
            margin-top: 10px;
            border-radius: 10px;
            border-left: 5px solid #007bff;
        }

        .top-links {
            margin-bottom: 25px;
        }

        .top-links a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            margin-right: 10px;
        }

        hr {
            margin: 30px 0;
        }

        .small {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-links">
            <a href="/index.html">Napi Quiz</a>
            <a href="/swagger">Swagger</a>
        </div>

        <h1>Fizz Liga Quiz - Admin oldal</h1>

        <h2>Új kérdés felvitele</h2>

        <input type="text" id="kerdesSzoveg" placeholder="Kérdés szövege">
        <input type="text" id="valaszA" placeholder="A válasz">
        <input type="text" id="valaszB" placeholder="B válasz">
        <input type="text" id="valaszC" placeholder="C válasz">
        <input type="text" id="valaszD" placeholder="D válasz">

        <select id="helyesValasz">
            <option value="A">A a helyes</option>
            <option value="B">B a helyes</option>
            <option value="C">C a helyes</option>
            <option value="D">D a helyes</option>
        </select>

        <input type="text" id="kategoria" placeholder="Kategória">
        <input type="text" id="nehezseg" placeholder="Nehézség">

        <button onclick="ujKerdes()">Kérdés mentése</button>
        <div class="message" id="uzenet"></div>

        <hr>

        <h2>Napi quiz beállítása</h2>

        <input type="number" id="dailyKerdesId" placeholder="Kérdés ID">
        <input type="date" id="dailyDatum">
        <button onclick="setDailyQuiz()">Napi quiz beállítása</button>

        <div class="message" id="dailyUzenet"></div>

        <hr>

        <h2>Kérdések listája</h2>
        <p class="small">Innen ki tudod nézni az ID-kat a napi kérdés beállításához.</p>
        <button onclick="loadKerdesek()">Frissítés</button>

        <div id="kerdesLista"></div>
    </div>

    <script>
        function ujKerdes() {
    const body = {
        kerdesSzoveg: document.getElementById("kerdesSzoveg").value,
        valaszA: document.getElementById("valaszA").value,
        valaszB: document.getElementById("valaszB").value,
        valaszC: document.getElementById("valaszC").value,
        valaszD: document.getElementById("valaszD").value,
        helyesValasz: document.getElementById("helyesValasz").value,
        kategoria: document.getElementById("kategoria").value,
        nehezseg: document.getElementById("nehezseg").value
    };

    fetch("/api/quiz", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    })
    .then(response => response.json())
    .then(data => {
        const uzenet = document.getElementById("uzenet");

        if (data.message) {
            uzenet.innerText = "Kérdés mentve!";
        } else {
            uzenet.innerText = "Hiba történt.";
        }

        document.getElementById("kerdesSzoveg").value = "";
        document.getElementById("valaszA").value = "";
        document.getElementById("valaszB").value = "";
        document.getElementById("valaszC").value = "";
        document.getElementById("valaszD").value = "";
        document.getElementById("kategoria").value = "";
        document.getElementById("nehezseg").value = "";

        loadKerdesek();
    })
    .catch(() => {
        document.getElementById("uzenet").innerText = "Hiba történt.";
    });
}

        function setDailyQuiz() {
    const kerdesId = parseInt(document.getElementById("dailyKerdesId").value);
    const datum = document.getElementById("dailyDatum").value;

    fetch("/api/quiz/set-daily", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            kerdesId: kerdesId,
            datum: datum
        })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("dailyUzenet").innerText = data.message;
    })
    .catch(() => {
        document.getElementById("dailyUzenet").innerText = "Hiba történt.";
    });
}

        function loadKerdesek() {
    const lista = document.getElementById("kerdesLista");
    lista.innerHTML = "Betöltés...";

    fetch("/api/quiz")
        .then(response => response.json())
        .then(data => {

            if (data.length === 0) {
                lista.innerHTML = "Nincs kérdés.";
                return;
            }

            lista.innerHTML = "";

            data.forEach(k => {
                lista.innerHTML += `
                    <div>
                        <b>ID:</b> ${k.id}<br>
                        <b>Kérdés:</b> ${k.kerdesSzoveg}<br>
                        <b>Helyes:</b> ${k.helyesValasz}<br><br>
                    </div>
                `;
            });
        })
        .catch(() => {
            lista.innerHTML = "Hiba történt.";
        });
}

        loadKerdesek();
    </script>
</body>
</html>
