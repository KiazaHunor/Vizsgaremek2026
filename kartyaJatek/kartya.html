<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizz Liga - Kártyajáték</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

<div class="game-area">
    <a href="../foprogram/szep.html" class="btn-back">⬅ Vissza a főoldalra</a>

    <div class="info-wrapper">
        <button type="button" class="info-btn" data-bs-toggle="modal" data-bs-target="#gameInfoModal">
            <i class="bi bi-info-lg"></i>
        </button>
    </div>

    <div class="scoreboard">
        <div class="score-box">
            <span class="score-label">Játékos</span>
            <span id="player-score" class="score-value">0</span>
        </div>
        <div class="score-divider">:</div>
        <div class="score-box">
            <span class="score-label">Ellenfél</span>
            <span id="enemy-score" class="score-value">0</span>
        </div>
    </div>

    <div class="deck enemy-deck">Ellenfél<br> pakli</div>
    <div class="hand enemy-hand" id="enemy-hand"></div>

    <div class="battle-area">
        <div id="player-battle" class="battle-card"></div>
        <div id="enemy-battle" class="battle-card"></div>
    </div>

    <div class="center-controls">
        <button id="play-round">Kör lejátszása</button>
        <button id="restart-game">Új játék</button>
    </div>

    <div class="hand player-hand" id="player-hand"></div>
    <div class="deck player-deck" id="player-deck">Játékos<br> pakli</div>
</div>

<div id="game-message" class="game-message"></div>

<div class="modal fade" id="gameInfoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white">

      <div class="modal-header">
        <h5 class="modal-title">Játékinformáció</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        fasz fasz
      </div>

    </div>
  </div>
</div>

<script>
    let players = [];

    fetch('kartyaJatek.php')
        .then(response => response.json())
        .then(data => {
            players = data;
            console.log("Játékosok betöltve:", players);
        })
        .catch(error => {
            console.error('Hiba a játékosok betöltése közben:', error);
        });
</script>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
