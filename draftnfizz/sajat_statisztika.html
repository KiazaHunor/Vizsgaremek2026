<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saját statisztikák</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>


    <div class="container-fluid mt-3">
        <div id="navbar-container"></div>
    </div>
    <main class="container mt-4">
        <article class="p-4">
            <h3 class="mb-3">Kártyajáték eredményeid</h3>
            <p class="tabella-subtitle mb-4">Itt láthatod az elmentett meccseid eredményeit.</p>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="news-card p-3 text-center">
                        <h5>Összes meccs</h5>
                        <div id="total-games" class="fs-3 fw-bold">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="news-card p-3 text-center">
                        <h5>Győzelem</h5>
                        <div id="wins" class="fs-3 fw-bold text-success">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="news-card p-3 text-center">
                        <h5>Döntetlen</h5>
                        <div id="draws" class="fs-3 fw-bold text-warning">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="news-card p-3 text-center">
                        <h5>Vereség</h5>
                        <div id="losses" class="fs-3 fw-bold text-danger">0</div>
                    </div>
                </div>
            </div>

            <div class="recent-form-card mb-4">
                <h4 class="recent-form-title">Utolsó öt meccs eredménye:</h4>
                <div id="recent-five" class="recent-form-list"></div>
            </div>

            <div id="stats-table"></div>
        </article>
    </main>
    <div id="footer-container"></div>

    <script>
    const token = localStorage.getItem("token");
    const statsTable = document.getElementById("stats-table");
    const recentFiveContainer = document.getElementById("recent-five");

    function formatResult(result) {
        if (result === "win") return "Győzelem";
        if (result === "draw") return "Döntetlen";
        if (result === "loss") return "Vereség";
        return result;
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        if (isNaN(date)) return dateString;

        return date.toLocaleString("hu-HU", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    if (!token) {
        statsTable.innerHTML = `
            <div class="alert alert-warning">
                A statisztikák megtekintéséhez jelentkezz be.
            </div>
        `;
        recentFiveContainer.innerHTML = `
            <span class="text-muted">Bejelentkezés után jelennek meg az adataid.</span>
        `;
    } else {
        fetch("get_card_game_results.php", {
            headers: {
                "Authorization": "Bearer " + token
            }
        })
        .then(res => res.json())
        .then(data => {
            if (!data.success) {
                statsTable.innerHTML = `
                    <div class="alert alert-danger">${data.message}</div>
                `;
                return;
            }

            document.getElementById("total-games").textContent = data.summary.total;
            document.getElementById("wins").textContent = data.summary.wins;
            document.getElementById("draws").textContent = data.summary.draws;
            document.getElementById("losses").textContent = data.summary.losses;

            const lastFive = data.recentFive || [];

            if (lastFive.length > 0) {
                let recentHtml = "";

                lastFive.forEach((match, index) => {
                    let cls = "";
                    let symbol = "";

                    if (match.result === "win") {
                        cls = "win";
                        symbol = "✓";
                    } else if (match.result === "loss") {
                        cls = "loss";
                        symbol = "✕";
                    } else {
                        cls = "draw";
                        symbol = "–";
                    }

                    recentHtml += `
                        <div class="form-badge ${cls} delay-${index + 1}"
                            title="${formatResult(match.result)} | ${match.player_score}-${match.enemy_score} | ${formatDate(match.played_at)}">
                            ${symbol}
                        </div>
                    `;
                });

                recentFiveContainer.innerHTML = recentHtml;
            } else {
                recentFiveContainer.innerHTML = `
                    <span class="text-muted">Még nincs lejátszott meccsed.</span>
                `;
            }

            let html = `
                <div class="table-responsive">
                    <table class="table table-striped table-dark align-middle">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Eredmény</th>
                                <th>Állás</th>
                                <th>Játékos pont</th>
                                <th>Ellenfél pont</th>
                                <th>Mikor játszottál</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            if (lastFive.length === 0) {
                html += `
                    <tr>
                        <td colspan="6" class="text-center">Még nincs elmentett meccsed.</td>
                    </tr>
                `;
            } else {
                lastFive.forEach((row, index) => {
                    let badgeClass = "secondary";

                    if (row.result === "win") badgeClass = "success";
                    else if (row.result === "loss") badgeClass = "danger";
                    else if (row.result === "draw") badgeClass = "warning";

                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td><span class="badge bg-${badgeClass}">${formatResult(row.result)}</span></td>
                            <td>${row.player_score} - ${row.enemy_score}</td>
                            <td>${row.player_score}</td>
                            <td>${row.enemy_score}</td>
                            <td>${formatDate(row.played_at)}</td>
                        </tr>
                    `;
                });
            }

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            statsTable.innerHTML = html;
        })
        .catch(error => {
            statsTable.innerHTML = `
                <div class="alert alert-danger">Hiba a statisztikák betöltése közben.</div>
            `;
            console.error(error);
        });
    }
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar.js"></script>
    <script src="menu.js"></script>
    <script src="theme.js"></script>
    <script src="footer.jss"></script>
</body>

</html>
