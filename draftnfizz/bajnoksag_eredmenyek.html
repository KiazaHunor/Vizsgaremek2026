<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <title>Bajnokság eredmények</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bajnoksag_eredmenyek.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="results-page">

        <h1 class="results-title">🏆 Bajnokság eredmények</h1>
        <div class="results-subtitle">Az utolsó lezárt bajnokságok</div>

        <div class="back-home-wrap">
            <a href="szep.html" class="back-home-btn">
                ⬅ Vissza a főoldalra
            </a>
        </div>

        <!-- LISTA -->
        <div id="tournament-list" class="row g-3 mb-4"></div>

        <!-- RANGLISTA -->
        <div id="result-panel" class="result-panel d-none">
            <h2 id="result-title" class="result-panel-title">Ranglista</h2>

            <div class="table-responsive">
                <table class="table result-table text-center align-middle">
                    <thead>
                        <tr>
                            <th>Hely</th>
                            <th>Játékos</th>
                            <th>Csapat</th>
                            <th>Chem</th>
                            <th>Rating</th>
                            <th>Pont</th>
                            <th>Credit</th>
                        </tr>
                    </thead>
                    <tbody id="result-body"></tbody>
                </table>
            </div>
        </div>

    </div>
    <script>
        function loadFinishedTournaments() {
            fetch("get_finished_tournaments.php")
                .then(r => r.json())
                .then(data => {
                    const box = document.getElementById("tournament-list");

                    if (!data.success || data.tournaments.length === 0) {
                        box.innerHTML = `<div class="text-center text-light">Még nincs lezárt bajnokság.</div>`;
                        return;
                    }

                    box.innerHTML = data.tournaments.map(t => `
            <div class="col-12 col-md-6 col-lg-3">
              <div class="card bg-dark text-light border-success h-100">
                <div class="card-body text-center">
                  <h5 class="card-title">${t.name}</h5>
                  <p class="small mb-2">
                    ${t.start_at}<br>
                    ${t.entry_deadline}
                  </p>
                  <button class="btn btn-outline-success w-100" onclick="loadTournamentResult(${t.id}, '${t.name}')">
                    Ranglista
                  </button>
                </div>
              </div>
            </div>
          `).join("");
                });
        }

        function loadTournamentResult(id, name) {
            fetch("get_tournament_result.php?id=" + id)
                .then(r => r.json())
                .then(data => {
                    const panel = document.getElementById("result-panel");
                    const title = document.getElementById("result-title");
                    const body = document.getElementById("result-body");

                    panel.classList.remove("d-none");
                    title.textContent = "🏆 " + name + " ranglista";

                    if (!data.success || data.results.length === 0) {
                        body.innerHTML = `<tr><td colspan="7">Nincs eredmény.</td></tr>`;
                        return;
                    }

                    box.innerHTML = data.tournaments.map(t => `
                    <div class="col-12 col-md-6 col-lg-3">
                        <div class="tournament-result-card p-3 text-center">

                        <h5 class="card-title mb-2">${t.name}</h5>

                        <p class="card-text small mb-3">
                            ${t.start_at}<br>
                            ${t.entry_deadline}
                        </p>

                        <button class="btn result-open-btn w-100"
                            onclick="loadTournamentResult(${t.id}, '${t.name}')">
                            Ranglista
                        </button>

                        </div>
                    </div>
                    `).join("");

                    panel.scrollIntoView({ behavior: "smooth" });
                });
        }

        document.addEventListener("DOMContentLoaded", loadFinishedTournaments);
    </script>
    <script src="theme.js"></script>
</body>

</html>
