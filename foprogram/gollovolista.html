<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góllövőlista</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

  <div class="container-fluid">
    <header class="col-12">
      <h1 class="text-center p-3"><b>Fizz Liga</b>
        <a href="szep.html"><img id="logo" src="../Fizz_Liga_NBI.png" alt="Fizz Liga"></a>
      </h1>

      <div id="navbar-container"></div>
    </header>

    <div class="row justify-content-center mt-4 mb-4">
      <div class="col-12 col-lg-10">
        <article>
          <h3><i class="bi bi-trophy"></i> Góllövőlista</h3>
          <hr>

          <div id="gollovolista">Betöltés...</div>
        </article>
      </div>
    </div>

    <div class="row">
      <div id="footer-container"></div>
    </div>
  </div>

  <script>
    fetch("../gollovolista.php")
      .then(res => res.json())
      .then(data => {

        if (data.error) {
          document.getElementById("gollovolista").innerHTML = data.error;
          return;
        }

        let html = `
      <div class="table-responsive">
        <table class="table table-striped text-center align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th>Játékos</th>
              <th>Csapat</th>
              <th>Gól</th>
            </tr>
          </thead>
          <tbody>
    `;

        data.forEach(player => {
          html += `
        <tr>
          <td>${player.hely}</td>
          <td class="fw-bold">${player.jatekos}</td>
          <td>${player.csapat}</td>
          <td><span class="gol-badge">${player.gol}</span></td>
        </tr>
      `;
        });

        html += `</tbody></table></div>`;

        document.getElementById("gollovolista").innerHTML = html;
      })
      .catch(err => {
        document.getElementById("gollovolista").innerHTML = "Hiba történt";
      });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="navbar.js"></script>
  <script src="theme.js"></script>
  <script src="menu.js"></script>
  <script src="footer.js"></script>
</body>

</html>
