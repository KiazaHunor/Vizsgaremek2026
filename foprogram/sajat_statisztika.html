<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saját statisztikák</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="container py-3">
    <h1 class="text-center">Saját statisztikák</h1>
</header>

<div class="container mt-3">
    <div id="navbar-container"></div>
</div>

<main class="container mt-4">
    <article class="p-4">
        <h3 class="mb-3">Kártyajáték eredményeid</h3>
        <p class="tabella-subtitle mb-4">Itt láthatod az elmentett meccseid eredményeit.</p>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="news-card p-3 text-center">
                    <h5>Összes meccs</h5>
                    <div id="total-games" class="fs-3 fw-bold">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="news-card p-3 text-center">
                    <h5>Győzelem</h5>
                    <div id="wins" class="fs-3 fw-bold text-success">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="news-card p-3 text-center">
                    <h5>Döntetlen</h5>
                    <div id="draws" class="fs-3 fw-bold text-warning">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="news-card p-3 text-center">
                    <h5>Vereség</h5>
                    <div id="losses" class="fs-3 fw-bold text-danger">0</div>
                </div>
            </div>
        </div>
        <div class="recent-form-card mb-4">
            <h4 class="recent-form-title">Utolsó öt meccs eredménye:</h4>
            <div id="recent-five" class="recent-form-list"></div>
        </div>

        <div id="stats-table"></div>
    </article>
</main>

<script>
fetch("navbar.html")
    .then(res => res.text())
    .then(data => {
        document.getElementById("navbar-container").innerHTML = data;
    });

fetch("get_card_game_results.php")
    .then(res => res.json())
    .then(data => {
        if (!data.success) {
            document.getElementById("stats-table").innerHTML =
                `<div class="alert alert-danger">${data.message}</div>`;
            return;
        }

        document.getElementById("total-games").textContent = data.summary.total;
        document.getElementById("wins").textContent = data.summary.wins;
        document.getElementById("draws").textContent = data.summary.draws;
        document.getElementById("losses").textContent = data.summary.losses;

        let html = `
            <div class="table-responsive">
                <table class="table table-striped table-dark align-middle">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Eredmény</th>
                            <th>Játékos pont</th>
                            <th>Ellenfél pont</th>
                            <th>Dátum</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        if (data.results.length === 0) {
            html += `
                <tr>
                    <td colspan="5" class="text-center">Még nincs elmentett eredmény.</td>
                </tr>
            `;
        } else {
            data.results.forEach((row, index) => {
                let resultText = "";
                if (row.result === "win") resultText = "Győzelem";
                else if (row.result === "draw") resultText = "Döntetlen";
                else if (row.result === "loss") resultText = "Vereség";

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${resultText}</td>
                        <td>${row.player_score}</td>
                        <td>${row.enemy_score}</td>
                        <td>${row.played_at}</td>
                    </tr>
                `;
            });
        }

        html += `
                    </tbody>
                </table>
            </div>
        `;

        document.getElementById("stats-table").innerHTML = html;
        const recentFiveContainer = document.getElementById("recent-five");

    if (data.recentFive && data.recentFive.length > 0) {
        let recentHtml = "";

        data.recentFive.forEach((match, index) => {
            let cls = "";
            let symbol = "";

            if (match.result === "win") {
                cls = "win";
                symbol = "✓";
            } else if (match.result === "loss") {
                cls = "loss";
                symbol = "✕";
            } else {
                cls = "draw";
                symbol = "–";
            }

            recentHtml += `
                <div class="form-badge ${cls} delay-${index + 1}" 
                    title="${match.result} | ${match.player_score}-${match.enemy_score}">
                    ${symbol}
                </div>
            `;
        });

        recentFiveContainer.innerHTML = recentHtml;
    } else {
        recentFiveContainer.innerHTML = `<span class="text-muted">Még nincs 5 lejátszott meccs.</span>`;
    }
    })
    .catch(error => {
        document.getElementById("stats-table").innerHTML =
            `<div class="alert alert-danger">Hiba a statisztikák betöltése közben.</div>`;
        console.error(error);
    })
    ;
    
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
