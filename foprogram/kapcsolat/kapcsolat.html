<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <title>Kapcsolat – Fizz Liga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="kapcsolat.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

  <section class="contact-hero">
    <h1>📬 Kapcsolat</h1>
    <div class="accent-line"></div>
  </section>

  <div class="container-fluid">
    <div class="contact-card">

      <p>Kérdésed, hibát találtál vagy ötleted van? Írj nekünk!</p>
      <p><strong>Email:</strong> <span class="email-highlight">fizzpro2026@gmail.com</span></p>

      <div id="login-warning" class="alert alert-warning d-none">
        Az üzenetküldéshez be kell jelentkezned.
      </div>

      <div id="form-message"></div>

      <div id="form-wrapper" class="d-none">
        <form id="kapcsolat-form" class="mt-4">

          <div class="mb-3">
            <label for="logged-user">Felhasználónév</label>
            <input type="text" id="logged-user" name="username" class="form-control" readonly>
          </div>

          <div class="mb-3">
            <label for="logged-email">Email cím</label>
            <input type="email" id="logged-email" name="email" class="form-control" readonly>
          </div>

          <div class="mb-3">
            <label for="targy">Tárgy</label>
            <input type="text" id="targy" name="targy" class="form-control" placeholder="Tárgy..." required>
          </div>

          <div class="mb-3">
            <label for="uzenet">Üzenet</label>
            <textarea id="uzenet" name="uzenet" class="form-control" rows="4"
              placeholder="Írd ide az üzeneted..." required></textarea>
          </div>

          <button type="submit" class="btn btn-send">Üzenet küldése</button>
        </form>
      </div>

      <a href="../szep.html" class="btn btn-back">⬅ Vissza a főoldalra</a>
    </div>

    <div class="row">
      <div id="footer-container"></div>
    </div>
  </div>

  <script>
    const PROFILE_API = "http://localhost/oliverhtdoc/Vizsgaremek2026/bejelentkezo/backend/api/profile.php";
    const SEND_API = "kapcsolat_kuldes_token.php";

    const token = localStorage.getItem("token");
    const loginWarning = document.getElementById("login-warning");
    const formWrapper = document.getElementById("form-wrapper");
    const loggedUser = document.getElementById("logged-user");
    const loggedEmail = document.getElementById("logged-email");
    const kapcsolatForm = document.getElementById("kapcsolat-form");
    const formMessage = document.getElementById("form-message");

    function checkLogin() {
      if (!token) {
        loginWarning.classList.remove("d-none");
        formWrapper.classList.add("d-none");
        return;
      }

      fetch(PROFILE_API, {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + token
        }
      })
        .then(response => response.json())
        .then(data => {
          if (!data.success) {
            localStorage.removeItem("token");
            loginWarning.classList.remove("d-none");
            formWrapper.classList.add("d-none");
            return;
          }

          loggedUser.value = data.user.username || "";
          loggedEmail.value = data.user.email || "";

          loginWarning.classList.add("d-none");
          formWrapper.classList.remove("d-none");
        })
        .catch(error => {
          console.error(error);
          loginWarning.classList.remove("d-none");
          formWrapper.classList.add("d-none");
        });
    }

    kapcsolatForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const targy = document.getElementById("targy").value.trim();
      const uzenet = document.getElementById("uzenet").value.trim();

      fetch(SEND_API, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          targy: targy,
          uzenet: uzenet
        })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            formMessage.innerHTML = `<div class="alert alert-success">Elküldve!</div>`;
            document.getElementById("targy").value = "";
            document.getElementById("uzenet").value = "";
          } else {
            formMessage.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
          }
        })
        .catch(() => {
          formMessage.innerHTML = `<div class="alert alert-danger">Szerverhiba történt.</div>`;
        });
    });

    fetch("../footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer-container").innerHTML = data;
      });

    checkLogin();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <script src="../footer.js"></script>
</body>

</html>
