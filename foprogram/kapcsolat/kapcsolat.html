<html lang="hu">
<head>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../kapcsolat.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>

  <!-- HERO -->
  <section class="contact-hero">
    <h1>📬 Kapcsolat</h1>
    <div class="accent-line"></div>
  </section>

  <div class="container">
    <div class="contact-card">

      <p>Kérdésed, hibát találtál vagy ötleted van? Írj nekünk!</p>
      <p><strong>Email:</strong> <span class="email-highlight">fizzliga@gmail.com</span></p>

      <form class="mt-4" action="kapcsolat_kuldes.php" method="POST">
        <div class="mb-3">
          <label for="kapcsolatnev">Név</label>
          <input type="text" id="kapcsolatnev" name="kapcsolatnev" class="form-control" placeholder="Neved" required>
        </div>

        <div class="mb-3">
          <label for="kapcsolatemail">Email cím</label>
          <input type="email" id="kapcsolatemail" name="kapcsolatemail" class="form-control" placeholder="email@pelda.hu" required>
        </div>

        <div class="mb-3">
          <label for="uzenet">Üzenet</label>
          <textarea id="uzenet" name="uzenet" class="form-control" rows="4" placeholder="Írd ide az üzeneted..." required></textarea>
        </div>

        <button type="submit" class="btn btn-send">Üzenet küldése</button>
      </form>

      <a href="../szep.html" class="btn btn-back">⬅ Vissza a főoldalra</a>

    </div>
  </div>
  <div id="footer-container"></div>
   <script>
    const PROFILE_API = "http://localhost/oliverhtdoc/Vizsgaremek2026/bejelentkezo/backend/api/profile.php";
    const SEND_API = "kapcsolat_kuldes_token.php";

    const token = localStorage.getItem("token");
    const loginWarning = document.getElementById("login-warning");
    const formWrapper = document.getElementById("form-wrapper");
    const loggedUser = document.getElementById("logged-user");
    const loggedEmail = document.getElementById("logged-email");
    const kapcsolatForm = document.getElementById("kapcsolat-form");
    const formMessage = document.getElementById("form-message");

      function checkLogin() {
    if (!token) {
      loginWarning.classList.remove("d-none");
      formWrapper.classList.add("d-none");
      return;
    }

    fetch(PROFILE_API, {
      method: "GET",
      headers: {
        "Authorization": "Bearer " + token
      }
    })
    .then(response => response.json())
    .then(data => {
      if (!data.success) {
        localStorage.removeItem("token");
        loginWarning.classList.remove("d-none");
        formWrapper.classList.add("d-none");
        return;
      }

      loggedUser.value = data.user.username || "";
      loggedEmail.value = data.user.email || "";

      loginWarning.classList.add("d-none");
      formWrapper.classList.remove("d-none");
    })
    .catch(error => {
      console.error(error);
      loginWarning.classList.remove("d-none");
      formWrapper.classList.add("d-none");
    });
  }

    
         fetch(SEND_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ targy, uzenet })
        }).then(response=>response.json())
          .then(data=>{
            if (data.success) {
          formMessage.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
          kapcsolatForm.reset();
        } else {
          formMessage.innerHTML = `<div class="alert alert-danger">${data.error || "Hiba történt."}</div>`;
        }
          })
        .catch(error=>{ 
        console.error(error);
        formMessage.innerHTML = `<div class="alert alert-danger">Szerverhiba történt az üzenet küldése közben.</div>`;
      });
    
  
</script>
</body>
</html>
