<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kredit Toplista</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">

  <script src="menu.js"></script>
  <script src="navbar.js"></script>
  <script src="footer.js"></script>
  <script src="theme.js"></script>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <header class="col-12">
        <h1 class="text-center p-3"><b>Fizz Liga</b>
          <a href="szep.html"><img id="logo" src="../Fizz_Liga_NBI.png" alt="Fizz Liga"></a>
        </h1>
        <div id="navbar-container"></div>
      </header>
    </div>

    <div class="row justify-content-center mt-4 mb-4">
      <div class="col-12 col-lg-10 col-xl-8">
        <section class="leaderboard-card">
          <div class="leaderboard-header">
            <h2><i class="bi bi-trophy-fill"></i> Kredit toplista</h2>
            <p class="leaderboard-subtitle">
              Minden helyes NapiQuiz válasz = 1 pont = 1 kredit
            </p>
          </div>

          <div id="leaderboardList">
            <div class="empty-box">Betöltés...</div>
          </div>
        </section>

        <div class="text-center mt-4">
          <a href="szep.html" class="btn btn-outline-light">⬅ Vissza a főoldalra</a>
        </div>
      </div>
    </div>

    <div id="footer-container"></div>
  </div>

  <script>
    function loadCreditLeaderboard() {
      fetch("../bejelentkezo/backend/api/leaderboard.php")
        .then(r => r.json())
        .then(data => {

          var container = document.getElementById("leaderboardList");

          if (!data.success || !data.leaderboard || data.leaderboard.length === 0) {
            container.innerHTML = '<div class="empty-box">Még nincs adat.</div>';
            return;
          }

          var html = "";

          data.leaderboard.forEach(function(user, index) {

            var extraClass = "";
            var rankDisplay = index + 1;
            var streakHtml = "";

            if (index === 0) {
              extraClass = "top1";
              rankDisplay = "🥇";
            } else if (index === 1) {
              extraClass = "top2";
              rankDisplay = "🥈";
            } else if (index === 2) {
              extraClass = "top3";
              rankDisplay = "🥉";
            }

            if (user.current_streak >= 2) {
              streakHtml = '<p class="leaderboard-streak">🔥 ' + user.current_streak + '</p>';
            }

            html += `
              <div class="leaderboard-row ${extraClass}">
                <div class="leaderboard-left">
                  <div class="leaderboard-rank">${rankDisplay}</div>
                  <img class="leaderboard-avatar" src="${user.profile_image}" alt="${user.username}">
                  <p class="leaderboard-name">${user.username}</p>
                </div>

                <div class="leaderboard-right">
                  <div class="leaderboard-credit-label">Kredit</div>
                  <p class="leaderboard-credit-value">${user.credits}</p>
                  ${streakHtml}
                </div>
              </div>
            `;
          });

          container.innerHTML = html;
        });
    }

    document.addEventListener("DOMContentLoaded", loadCreditLeaderboard);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
