<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktív bajnokság leaderboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="draft.css?v=10">
  <style>
    body {
      background: #0b0f14;
      color: #e6edf3;
    }

    .leaderboard-wrap {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .leaderboard-panel {
      background: linear-gradient(145deg, #0f141c, #121821);
      border: 1px solid rgba(0, 255, 157, 0.2);
      border-radius: 18px;
      box-shadow: 0 0 25px rgba(0,255,157,0.08);
      padding: 24px;
    }

    .leaderboard-title {
      text-align: center;
      color: #00ff9d;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .leaderboard-subtitle {
      text-align: center;
      color: #9aa7b2;
      margin-bottom: 24px;
    }

    .top3-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .podium-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
    }

    .podium-rank {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffe66d;
      margin-bottom: 8px;
    }

    .podium-user {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
    }

    .podium-team {
      color: #9aa7b2;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .podium-score {
      color: #00ff9d;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 10px;
    }

    .leaderboard-table thead th {
      color: #9aa7b2;
      font-weight: 600;
      border: none;
      padding: 8px 12px;
      white-space: nowrap;
    }

    .leaderboard-table tbody tr {
      background: rgba(255,255,255,0.03);
    }

    .leaderboard-table tbody td {
      padding: 14px 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #e6edf3;
      white-space: nowrap;
    }

    .leaderboard-table tbody td:first-child {
      border-left: 1px solid rgba(255,255,255,0.05);
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }

    .leaderboard-table tbody td:last-child {
      border-right: 1px solid rgba(255,255,255,0.05);
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .rank-badge {
      color: #00ff9d;
      font-weight: 800;
    }

    .final-score {
      color: #ffe66d;
      font-weight: 800;
    }

    .empty-box {
      text-align: center;
      color: #9aa7b2;
      padding: 30px 10px;
    }

    @media (max-width: 900px) {
      .top3-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="leaderboard-wrap">
    <div class="leaderboard-panel">
      <h1 class="leaderboard-title">🏆 Aktív bajnokság leaderboard</h1>
      <div id="leaderboard-subtitle" class="leaderboard-subtitle">Betöltés...</div>

      <div id="top3-container" class="top3-row"></div>

      <div class="table-wrap">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Hely</th>
              <th>Játékos</th>
              <th>Csapatnév</th>
              <th>Chemistry</th>
              <th>Rating</th>
              <th>Fő pont</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <tr>
              <td colspan="6" class="empty-box">Betöltés...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="text-center mt-4">
        <a href="szep.html" class="btn btn-outline-light">⬅ Vissza a főoldalra</a>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");

    if (!token) {
      alert("Be kell jelentkezned!");
      window.location.href = "../bejelentkezo/frontend/index.html";
    }

    function getTournamentIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return Number(params.get("tournament_id") || 0);
    }

    function loadActiveTournamentAndLeaderboard() {
      fetch("get_active_tournament.php", {
        headers: {
          Authorization: "Bearer " + token
        }
      })
        .then(response => response.json())
        .then(data => {
          if (!data.success || !data.tournament) {
            document.getElementById("leaderboard-subtitle").textContent = "Jelenleg nincs aktív bajnokság.";
            document.getElementById("leaderboard-body").innerHTML =
              `<tr><td colspan="6" class="empty-box">Nincs aktív bajnokság.</td></tr>`;
            document.getElementById("top3-container").innerHTML = "";
            return;
          }

          const tournament = data.tournament;
          document.getElementById("leaderboard-subtitle").textContent =
            tournament.name + " | Nevezési határidő: " + tournament.entry_deadline;

          loadLeaderboard(tournament.id);
        })
        .catch(error => {
          console.error(error);
          document.getElementById("leaderboard-subtitle").textContent = "Hiba történt.";
        });
    }

    function loadLeaderboard(tournamentId) {
      fetch("get_tournament_leaderboard.php?tournament_id=" + encodeURIComponent(tournamentId), {
        headers: {
          Authorization: "Bearer " + token
        }
      })
        .then(response => response.json())
        .then(data => {
          const body = document.getElementById("leaderboard-body");
          const top3 = document.getElementById("top3-container");

          if (!data.success || !data.leaderboard || data.leaderboard.length === 0) {
            body.innerHTML = `<tr><td colspan="6" class="empty-box">Még nincs nevező.</td></tr>`;
            top3.innerHTML = "";
            return;
          }

          const rows = data.leaderboard;

          top3.innerHTML = rows.slice(0, 3).map((item, index) => `
            <div class="podium-card">
              <div class="podium-rank">#${index + 1}</div>
              <div class="podium-user">${item.username || "Ismeretlen"}</div>
              <div class="podium-team">${item.team_name || "Névtelen csapat"}</div>
              <div class="podium-score">${item.final_score}</div>
            </div>
          `).join("");

          body.innerHTML = rows.map((item, index) => `
            <tr>
              <td><span class="rank-badge">#${index + 1}</span></td>
              <td>${item.username || "-"}</td>
              <td>${item.team_name || "-"}</td>
              <td>${item.chemistry_score || 0}</td>
              <td>${item.rating_avg_score || 0}</td>
              <td><span class="final-score">${item.final_score || 0}</span></td>
            </tr>
          `).join("");
        })
        .catch(error => {
          console.error(error);
          document.getElementById("leaderboard-body").innerHTML =
            `<tr><td colspan="6" class="empty-box">Hiba történt a leaderboard betöltése közben.</td></tr>`;
        });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const tournamentId = getTournamentIdFromUrl();

      if (tournamentId > 0) {
        document.getElementById("leaderboard-subtitle").textContent = "Betöltés...";
        loadLeaderboard(tournamentId);
      } else {
        loadActiveTournamentAndLeaderboard();
      }
    });
  </script>
  <script src="theme.js"></script>
</body>

</html>
