<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fizz Liga Draft</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="draft.css?v=5">
  <script src="theme.js"></script>
  <script src="menu.js"></script>
  <script src="navbar.js"></script>
  <script src="menu.js"></script>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <header class="col-12">
        <h1 class="text-center p-3"><b>Fizz Liga</b>
          <a href="szep.html"><img id="logo" src="../Fizz_Liga_NBI.png" alt="Fizz Liga"></a>
        </h1>
        <div id="navbar-container"></div>
      </header>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <section class="draft-section">
          <h2 id="cim">Válassz formációt</h2>
          <hr>

          <div id="formaciok" class="formation-buttons">
            <button class="btn btn-outline-success btn-formation" onclick="loadFormation('4-3-3')">4-3-3</button>
            <button class="btn btn-outline-success btn-formation" onclick="loadFormation('4-4-2')">4-4-2</button>
            <button class="btn btn-outline-success btn-formation" onclick="loadFormation('4-1-2-1-2')">4-1-2-1-2</button>
            <button class="btn btn-outline-success btn-formation" onclick="loadFormation('4-5-1')">4-5-1</button>
            <button class="btn btn-outline-success btn-formation" onclick="loadFormation('3-4-3')">3-4-3</button>
            <button class="btn btn-outline-success btn-formation" onclick="loadFormation('3-5-2')">3-5-2</button>
            <button class="btn btn-outline-success btn-formation" onclick="loadFormation('5-2-2-2')">5-2-2-2</button>
            <button class="btn btn-outline-success btn-formation" onclick="loadFormation('5-3-2-1')">5-3-2-1</button>
            <button class="btn btn-outline-success btn-formation" onclick="loadFormation('5-4-1')">5-4-1</button>
          </div>

          <div id="formation-container" class="formation-container"></div>

          <div id="extras-container" class="extras-container container-fluid px-0 mt-4"></div>

          <div class="back-button-wrap">
            <a href="szep.html" class="btn btn-outline-light mt-4">⬅ Vissza a főoldalra</a>
            <a href="game.html" class="btn btn-outline-light mt-4">⬅ Vissza a formációkhoz</a>
          </div>
        </section>
      </div>
    </div>

    <div class="row">
      <footer class="col-12">Készítette Fizz Liga Draft csapata <i class="bi bi-balloon-heart"></i></footer>
    </div>
  </div>

  <div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content custom-modal">
        <div class="modal-header">
          <h5 class="modal-title">Válassz játékost</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="player-list" class="list-group"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let selectedSwapSlot = null;
    let selectedSlot = null;

    const formations = {
      "4-3-3": [
        ["LW", "CF", "RW"],
        ["CM", "CAM", "CM"],
        ["LB", "CB", "CB", "RB"],
        ["GK"]
      ],
      "4-4-2": [
        ["CF", "CF"],
        ["LM", "CM", "CM", "RM"],
        ["LB", "CB", "CB", "RB"],
        ["GK"]
      ],
      "4-1-2-1-2": [
        ["CF", "CF"],
        ["CAM"],
        ["CM", "CM"],
        ["CDM"],
        ["LB", "CB", "CB", "RB"],
        ["GK"]
      ],
      "4-5-1": [
        ["CF"],
        ["LM", "CM", "CDM", "CM", "RM"],
        ["LB", "CB", "CB", "RB"],
        ["GK"]
      ],
      "3-4-3": [
        ["LW", "CF", "RW"],
        ["LM", "CM", "CM", "RM"],
        ["CB", "CB", "CB"],
        ["GK"]
      ],
      "3-5-2": [
        ["CF", "CF"],
        ["LM", "CM", "CAM", "CM", "RM"],
        ["CB", "CB", "CB"],
        ["GK"]
      ],
      "5-2-2-2": [
        ["CF", "CF"],
        ["CAM", "CAM"],
        ["CDM", "CDM"],
        ["LB", "CB", "CB", "CB", "RB"],
        ["GK"]
      ],
      "5-3-2-1": [
        ["CF"],
        ["CAM", "CAM"],
        ["CM", "CM", "CM"],
        ["LB", "CB", "CB", "CB", "RB"],
        ["GK"]
      ],
      "5-4-1": [
        ["CF"],
        ["LM", "CM", "CM", "RM"],
        ["LB", "CB", "CB", "CB", "RB"],
        ["GK"]
      ]
    };

    const extraSlots = [
      "CSERE", "CSERE", "CSERE", "CSERE", "CSERE", "CSERE",
      "CSERE", "TART", "TART", "TART", "TART", "TART"
    ];

    function getColClass(count) {
      switch (count) {
        case 1: return "col-4";
        case 2: return "col-4";
        case 3: return "col-4";
        case 4: return "col-3";
        case 5: return "col";
        default: return "col";
      }
    }

    function generateFormationHTML(rows) {
      return rows.map((row, rowIndex) => {
        const colClass = getColClass(row.length);
        const isLastRow = rowIndex === rows.length - 1;

        return `
        <div class="row justify-content-center g-3 formation-row ${isLastRow ? "" : "mb-4"}">
          ${row.map(position => `
            <div class="${colClass}">
              <div class="player" onclick="loadPlayers('${position}', this)">${position}</div>
            </div>
          `).join("")}
        </div>
      `;
      }).join("");
    }

    function generateExtras() {
      const container = document.getElementById("extras-container");

      container.innerHTML = `
      <div class="row g-3 justify-content-center">
        ${extraSlots.map(position => `
          <div class="col-6 col-sm-4 col-md-3 col-lg-2 extra-slot-wrap">
            <div class="extra-player" onclick="loadPlayers('${position}', this)">${position}</div>
          </div>
        `).join("")}
      </div>
    `;
    }

    function renderDraftCard(player, imageSrc) {
      return `
      <div class="draft-card">
        <div class="draft-card-top">
          <div class="draft-card-pos">${player.position}</div><br>
        </div>
        <div class="draft-card-team">${player.team}</div>
        <div class="draft-card-image">
          <img src="${imageSrc}" alt="${player.team}">
        </div>
        <div class="draft-card-nationality">${player.nationality}</div>
        <div class="draft-card-name">${player.name}</div>
      </div>
    `;
    }

    function loadFormation(formation) {
      document.getElementById("cim").innerText = "Állítsd össze a csapatodat";
      document.getElementById("formaciok").style.display = "none";

      const container = document.getElementById("formation-container");
      const rows = formations[formation];

      if (!rows) {
        container.innerHTML = `<div class="text-danger">Ismeretlen formáció.</div>`;
        return;
      }

      container.innerHTML = generateFormationHTML(rows);

      const players = container.querySelectorAll(".player");
      players.forEach((player, i) => {
        setTimeout(() => {
          player.classList.add("show");
        }, i * 180);
      });

      generateExtras();
    }

    function getUniquePlayers(players) {
      const seen = new Set();

      return players.filter(player => {
        const id = String(player.id);
        if (seen.has(id)) return false;
        seen.add(id);
        return true;
      });
    }

    function getSelectedPlayerIds(currentSlot = null) {
      const slots = document.querySelectorAll(".player.locked, .extra-player.locked");
      const ids = [];

      slots.forEach(slot => {
        if (!slot.dataset.playerId) return;
        if (currentSlot && slot === currentSlot) return;
        ids.push(String(slot.dataset.playerId));
      });

      return ids;
    }

    async function loadPlayers(position, element) {
      selectedSlot = element;

      try {
        const excludeIds = getSelectedPlayerIds(element);

        const response = await fetch(
          `get_players.php?position=${encodeURIComponent(position)}&exclude=${encodeURIComponent(excludeIds.join(","))}`
        );

        const text = await response.text();
        const data = JSON.parse(text);

        const playerList = document.getElementById("player-list");
        playerList.innerHTML = "";

        if (!data.success) {
          playerList.innerHTML = `<div class="text-danger">${data.message}</div>`;
        } else {
          const uniquePlayers = getUniquePlayers(data.players || []);
          const alreadyUsedIds = new Set(getSelectedPlayerIds(element));

          const filteredPlayers = uniquePlayers.filter(player => {
            return !alreadyUsedIds.has(String(player.id));
          });

          if (filteredPlayers.length === 0) {
            playerList.innerHTML = `<div class="text-warning">Nincs több választható játékos erre a pozícióra.</div>`;
          } else {
            filteredPlayers.forEach(player => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "list-group-item list-group-item-action custom-player-item";

              const imageSrc = player.shirt_image ? player.shirt_image : "hatternelkul/default.png";

              button.innerHTML = `
              <div class="d-flex align-items-center gap-3 text-start">
                <img
                  src="${imageSrc}"
                  alt="${player.team}"
                  style="width:50px; height:50px; object-fit:contain; border-radius:8px; border:1px solid #00ff9d; background:#0f141c;"
                >
                <div>
                  <strong>${player.name}</strong><br>
                  <small>${player.team}</small><br>
                  <small>${player.nationality}</small><br>
                  <small>${player.position}</small>
                </div>
              </div>
            `;

              button.onclick = function () {
                const slot = selectedSlot;
                const currentSelectedIds = new Set(getSelectedPlayerIds(slot));
                const playerId = String(player.id);

                if (currentSelectedIds.has(playerId)) {
                  alert("Ez a játékos már ki van választva.");
                  return;
                }

                slot.innerHTML = renderDraftCard(player, imageSrc);
                slot.dataset.playerId = player.id;
                slot.classList.add("locked");

                if (slot.classList.contains("player") || slot.classList.contains("extra-player")) {
                  slot.onclick = () => handleSlotClick(slot);
                }

                const modalInstance = bootstrap.Modal.getInstance(document.getElementById("playerModal"));
                modalInstance.hide();
              };

              playerList.appendChild(button);
            });
          }
        }

        const modal = new bootstrap.Modal(document.getElementById("playerModal"));
        modal.show();

      } catch (error) {
        console.error("Hiba:", error);
        alert("Hiba történt a játékosok betöltése közben.");
      }
    }

    function handleSlotClick(slot) {
      if (!slot.dataset.playerId) return;

      if (selectedSwapSlot === null) {
        selectedSwapSlot = slot;
        slot.classList.add("selected-swap");
        return;
      }

      if (selectedSwapSlot === slot) {
        slot.classList.remove("selected-swap");
        selectedSwapSlot = null;
        return;
      }

      const firstSlot = selectedSwapSlot;
      firstSlot.classList.remove("selected-swap");

      swapSlots(firstSlot, slot);

      selectedSwapSlot = null;
    }

    function swapSlots(slot1, slot2) {
      const tempHTML = slot1.innerHTML;
      const tempId = slot1.dataset.playerId;

      slot1.innerHTML = slot2.innerHTML;
      slot1.dataset.playerId = slot2.dataset.playerId;

      slot2.innerHTML = tempHTML;
      slot2.dataset.playerId = tempId;

      slot1.onclick = () => handleSlotClick(slot1);
      slot2.onclick = () => handleSlotClick(slot2);
    }
  </script>
</body>

</html>
