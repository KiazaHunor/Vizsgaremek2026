<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fizz Liga</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">
  <script src="script.js"></script>
  <script src="menu.js"></script>
  <script src="navbar.js"></script>
  <script src="footer.js"></script>
  <script src="theme.js"></script>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <header class="col-12">
        <h1 class="text-center p-3"><b>Fizz Liga</b>
          <a href="szep.html"><img id="logo" src="../Fizz_Liga_NBI.png" alt="Fizz Liga"></a>
        </h1>

        <div id="navbar-container"></div>

      </header>
    </div>
    <div class="row">
      <!--FŐ JÁTÉK RÉSZ-->
      <div class="col-12 col-md-8 col-lg-8">
        <section class="game-card"
          style="background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)), url('../gamehat.jpg');">
          <div class="game-card-content">
            <h3>Fizz Liga Draft Játék</h3>
            <a class="game-card-btn" href="kezdokep.html">
              <span>Játék indítása</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
                class="bi bi-arrow-right-circle-fill" viewBox="0 0 16 16">
                <path
                  d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M6.5 5.5a.5.5 0 0 0 0 1h2.793L7.146 8.646a.5.5 0 1 0 .708.708L10 7.207V10a.5.5 0 0 0 1 0V5.5z" />
              </svg>
            </a>
          </div>
        </section>

        <!--TABELLA-->
        <article>
          <h3><i class="bi bi-table"></i> Fizz Liga Tabella</h3>
          <hr>
          <div id="tabella">Betöltés...</div>
        </article>
      </div>
      <!--HÍREK-->
      <aside class="col-12 col-md-4 col-lg-4">
        <h3>Aktuális hírek</h3>
        <hr>
        <div class="row" id="news-container"></div>
      </aside>


    </div>
    <!--GÓL LÖVŐ LISTA-->
    <div class="row mt-4 mb-4 g-4">
      <div class="col-12 col-lg-6">
        <article>
          <h3><i class="bi bi-trophy"></i> Góllövőlista Fizz Liga</h3>
          <hr>
          <div id="gollovolista">Betöltés...</div>
        </article>
      </div>

      <div class="col-12 col-lg-4">
        <article>
          <h3><i class="bi bi-question-circle"></i> Napi Quiz</h3>
          <hr>
        </article>
      </div>
      <!--KÁRTYA JÁTÉK-->
      <div class="col-12 col-md-6 col-lg-2">
        <section class="game-card"
          style="background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)), url('../gerard.png');">
          <div class="game-card-content">
            <h3>Kártya játék</h3>
            <a class="game-card-btn" href="../kartyaJatek/kartyaJatek.html">
              <span>Játék indítása</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
                class="bi bi-arrow-right-circle-fill" viewBox="0 0 16 16">
                <path
                  d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M6.5 5.5a.5.5 0 0 0 0 1h2.793L7.146 8.646a.5.5 0 1 0 .708.708L10 7.207V10a.5.5 0 0 0 1 0V5.5z" />
              </svg>
            </a>
          </div>
        </section>
      </div>
    </div>

    <!--FOOTER -->
    <div id="footer-container">
    </div>




  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
