<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bejelentkezo.css">
</head>
<body>
    <main class="auth-page">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100 py-4">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    <div class="card auth-card shadow-lg">
                        <div class="card-header text-white text-center py-4">
                            <h1 class="mb-0 h3">Bejelentkezés</h1>
                        </div>

                        <div class="card-body p-4 p-md-4">
                            <div class="mb-3">
                                <label class="form-label" for="user">Felhasználónév</label>
                                <input type="text" id="user" class="form-control" placeholder="Felhasználónév">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="pass">Jelszó</label>
                                <input type="password" id="pass" class="form-control" placeholder="Jelszó">
                            </div>

                            <div class="d-grid mb-3">
                                <button class="btn btn-main" onclick="login()">Bejelentkezés</button>
                            </div>

                            <div class="auth-links text-center">
                                <p class="small mb-2 text-secondary-custom">
                                    Nincs még fiókod?
                                    <a href="regisztracio.html">Regisztrálj be</a>
                                </p>
                                <a href="ujjelszo.html" class="d-block mb-2">Elfelejtetted a jelszód?</a>
                                <a href="../../foprogram/html/szep.html" class="d-block">Vissza a főoldalra</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
