<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Profil</span>
            <div>
                <a href="../../foprogram/szep.html" class="btn btn-light btn-sm me-2">Főoldal</a>
                <button class="btn btn-danger btn-sm" onclick="logout()">Kijelentkezés</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="content">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Adatok betöltése...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost/oliverhtdoc/Vizsgaremek2026/bejelentkezo/backend/api';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        function loadProfile() {
            fetch(`${API_BASE_URL}/profile.php`, {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => {
                if (!r.ok) {
                    throw new Error('Érvénytelen token');
                }
                return r.json();
            })
            .then(d => {
                if (d.success) {
                    document.getElementById('content').innerHTML = `
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h3 class="mb-3">Üdv, ${d.user.username}!</h3>
                                <p><strong>Regisztráció dátuma:</strong> ${d.user.formatted_date}</p>

                                <hr>

                                <h5>Profil szerkesztése</h5>
                                <div class="mb-3">
                                    <label class="form-label">Új felhasználónév</label>
                                    <input type="text" id="newUsername" class="form-control" value="${d.user.username}">
                                </div>

                                <button class="btn btn-primary" onclick="updateProfile()">Mentés</button>
                            </div>
                        </div>
                    `;
                }
            })
            .catch(() => {
                localStorage.removeItem('token');
                window.location.href = 'index.html';
            });
        }

        function updateProfile() {
            const username = document.getElementById('newUsername').value.trim();

            if (!username) {
                alert('Add meg az új felhasználónevet!');
                return;
            }

            fetch(`${API_BASE_URL}/profile.php`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ username })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    alert(d.message || 'Profil frissítve');
                    loadProfile();
                } else {
                    alert(d.error || 'Nem sikerült a mentés');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Hiba történt a mentés közben');
            });
        }

        loadProfile();
    </script>
</body>
</html>
