<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">Profil</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false" aria-label="Navigáció megnyitása">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarMenu">
                <div class="ms-lg-auto d-flex flex-column flex-lg-row gap-2">
                    <a href="../../foprogram/szep.html" class="btn btn-light btn-sm px-3">Főoldal</a>
                    <button class="btn btn-danger btn-sm px-3" onclick="logout()">Kijelentkezés</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="dashboard-page py-4 py-md-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8 col-xl-7">
                    <div id="content">
                        <div class="loading-box text-center">
                            <div class="spinner-border mb-3" role="status"></div>
                            <p class="mb-0">Adatok betöltése...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost/oliverhtdoc/Vizsgaremek2026/bejelentkezo/backend/api';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        function loadProfile() {
            fetch(`${API_BASE_URL}/profile.php`, {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => {
                if (!r.ok) {
                    throw new Error('Érvénytelen token');
                }
                return r.json();
            })
            .then(d => {
                if (d.success) {
                    document.getElementById('content').innerHTML = `
                        <div class="card profile-card shadow-lg border-0">
                            <div class="card-body p-4 p-md-5">
                                <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                                    <div>
                                        <p class="text-uppercase small profile-label mb-1">Felhasználói profil</p>
                                        <h2 class="mb-0 welcome-title">Üdv, ${d.user.username}!</h2>
                                    </div>
                                    <span class="profile-badge">Aktív fiók</span>
                                </div>

                                <div class="info-box mb-4">
                                    <p class="mb-0 text-light">
                                        <strong>Regisztráció dátuma:</strong> ${d.user.formatted_date}
                                    </p>
                                </div>

                                <hr class="my-4">

                                <h3 class="h5 mb-3 text-light">Profil szerkesztése</h3>

                                <div class="mb-3">
                                    <label class="form-label" for="newUsername">Új felhasználónév</label>
                                    <input type="text" id="newUsername" class="form-control" value="${d.user.username}">
                                </div>

                                <div class="d-grid d-sm-flex gap-2">
                                    <button class="btn btn-main" onclick="updateProfile()">Mentés</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            })
            .catch(() => {
                localStorage.removeItem('token');
                window.location.href = 'index.html';
            });
        }

        function updateProfile() {
            const username = document.getElementById('newUsername').value.trim();

            if (!username) {
                alert('Add meg az új felhasználónevet!');
                return;
            }

            fetch(`${API_BASE_URL}/profile.php`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ username })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    alert(d.message || 'Profil frissítve');
                    loadProfile();
                } else {
                    alert(d.error || 'Nem sikerült a mentés');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Hiba történt a mentés közben');
            });
        }

        loadProfile();
    </script>
</body>
</html>
